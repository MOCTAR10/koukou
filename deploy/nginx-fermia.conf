server {
  listen 80;
  server_name fermia.greenleaves.ga;
  location /.well-known/acme-challenge/ { root /var/www/html; }
  location / { return 301 https://$host$request_uri; }
}
server {
  listen 443 ssl http2;
  server_name fermia.greenleaves.ga;
  ssl_certificate /etc/letsencrypt/live/fermia.greenleaves.ga/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/fermia.greenleaves.ga/privkey.pem;
  client_max_body_size 10m;
  root /var/www/fermia;

  location = /api/docs { return 301 /api/docs/; }
  location /api/ {
    proxy_pass http://127.0.0.1:3400/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
  location /apk/ { alias /var/www/trees-apk/fermia/; types { application/vnd.android.package-archive apk; } add_header Cache-Control "no-cache"; }
  location /uploads/ { proxy_pass http://127.0.0.1:3400/uploads/; }
  location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  # Public jury guide: static site (web/public/guide-jury), outside the SPA. /guide used to be the React page.
  # No CSP is set by this nginx, so the CDN Tailwind script and Google Fonts load as is.
  # /guide: static landing page (web/public/guide/index.html) with two doors, the jury guide and the video training.
  location = /guide { return 301 /guide/; }
  location = /guide/ { add_header Cache-Control "no-cache"; try_files /guide/index.html =404; }
  location = /guide-jury { return 301 /guide-jury/; }
  location /guide-jury/ {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/index.html =404;
  }
  location /guide-jury/img/ { add_header Cache-Control "public, max-age=2592000"; try_files $uri =404; }
  # Training videos: the page is static (web/public/formation); the videos, posters and catalog.json are
  # produced on the server by the video studio (/opt/fermia-studio) and published outside the web build,
  # so adding a clip needs no deploy (deploy.sh rsyncs web/dist with --delete).
  location = /formation { return 301 /formation/; }
  location /formation/ {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/index.html =404;
  }
  location /formation/media/ {
    alias /opt/fermia-studio/published/;
    add_header Cache-Control "no-cache";
    types { video/mp4 mp4; image/jpeg jpg; application/json json; text/vtt vtt; audio/mpeg mp3; }
  }
  location / { try_files $uri /index.html; }
}
