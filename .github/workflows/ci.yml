# Fermia — CI (fast checks)
#
# What this runs, and nothing more:
#   backend : TypeScript compile + oxlint + unit tests (vitest)
#   web     : tsc --noEmit + vite build + oxlint
#   mobile  : tsc --noEmit + eslint + unit tests (vitest) + Android bundle
#
# The backend e2e suite is NOT here on purpose: it needs PostgreSQL and runs
# ~28 specs sequentially (~10 min). It lives in `e2e.yml` (PRs, main, nightly).
#
# Node is pinned to 22 because the Expo app has a Node 22 specific quirk.
# If you upgrade Node locally, change `node-version` in all three jobs.

name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  # Lets you run it by hand from the Actions tab while testing.
  workflow_dispatch:

# If you push a second commit while a run is still going, cancel the old one.
# Saves Actions minutes and stops you reading stale results.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: these jobs only read the code.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (build + lint + test)
    runs-on: ubuntu-latest
    # A hung install or test should fail fast, not burn 6 hours of minutes.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          # Reuses the npm download cache between runs.
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # `npm ci` installs exactly what package-lock.json says, and fails loudly
      # if package.json and the lockfile disagree. Prefer it over `npm install`.
      - name: Install dependencies
        run: npm ci

      # `nest build` is also the typecheck: if TypeScript is unhappy, this fails.
      - name: Compile (typecheck)
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

  web:
    name: Web (build + lint)
    runs-on: ubuntu-latest
    # A hung install or test should fail fast, not burn 6 hours of minutes.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Runs `tsc --noEmit && vite build` — typecheck first, then bundle.
      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

  mobile:
    name: Mobile (typecheck + lint + test + bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      # There is no build script here — `tsc --noEmit` is the typecheck.
      - name: Typecheck
        run: npm run typecheck

      # Do not replace this with `npx expo lint`: it breaks on Node 22.
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      # Bundles the real app with Metro, the way a device build would. tsc does
      # not see assets: a missing image or font (`require('...png')`), a broken
      # asset path in app.json or a Metro resolution error only shows up here.
      - name: Bundle (Android, Metro)
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/expo-export"
        env:
          CI: 1
